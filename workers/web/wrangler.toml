main = ".open-next/worker.js"
name = "aiagents-hub-trading-sto"
compatibility_date = "2025-03-25"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[vars]
NEXT_PUBLIC_DEBUG = "true"
# Must match auth-worker TURNSTILE_SITE_KEY (Cloudflare Turnstile widget hostnames: aiagents-hub.vn + www)
NEXT_PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAADXOWPMRtW0XIcLk"
NEXT_PUBLIC_SMS_2FA_ENABLED = false
# Dashboard assistant at /dashboard/control/assistant. Baked in at `opennextjs-cloudflare build`.
NEXT_PUBLIC_DASHBOARD_ASSISTANT_WORKFLOW_ID = "33"
NEXT_PUBLIC_DASHBOARD_ASSISTANT_OWNER_ID = "e1a09eae9956f0489180c63f332235d0f6d9e8861b883d3c2f21802988c4ecff"
NEXT_PUBLIC_DASHBOARD_ASSISTANT_CHAT_PATH = "trigger-1791901863127"
# Public /support assistant. Workflow 34, published, share off. Baked in at opennextjs-cloudflare build.
NEXT_PUBLIC_SITE_SUPPORT_WORKFLOW_ID = "34"
NEXT_PUBLIC_SITE_SUPPORT_OWNER_ID = "e1a09eae9956f0489180c63f332235d0f6d9e8861b883d3c2f21802988c4ecff"
NEXT_PUBLIC_SITE_SUPPORT_CHAT_PATH = "trigger-1791965135447"

[limits]
cpu_ms = 300000

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
[[routes]]
pattern = "aiagents-hub.vn"
custom_domain = true