packages:
  - packages/*
  - workers/*

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  bufferutil: false
  esbuild: true
  keccak: false
  oracledb: false
  sharp: true
  unrs-resolver: true
  utf-8-validate: false
  workerd: true

# pnpm 10+ defaults link-workspace-packages to false, which makes the "*"
# specs for @aiagents-hub/workflow-nodes resolve from the registry (404)
# instead of the local packages/workflow-nodes workspace package.
linkWorkspacePackages: true

# @opennextjs/cloudflare@1.20.x pulls a non-existent AWS SDK patch range.
overrides:
  "@aws-sdk/signature-v4-multi-region": "3.996.42"
